<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBIT — Creator Commerce OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --bg-2:#eef0f7; --surface:#ffffff; --surface-2:#f9fafc;
  --border:rgba(15,23,42,.08); --border-strong:rgba(15,23,42,.14);
  --text:#0b1220; --text-2:#475069; --text-3:#8891a7;
  --brand:#6366f1; --brand-2:#8b5cf6; --cyan:#06b6d4; --emerald:#10b981;
  --amber:#f59e0b; --rose:#f43f5e; --pink:#ec4899;
  --grad:linear-gradient(120deg,#6366f1,#8b5cf6 45%,#06b6d4);
  --grad-2:linear-gradient(120deg,#ec4899,#8b5cf6 55%,#6366f1);
  --glass:rgba(255,255,255,.72); --glass-brd:rgba(255,255,255,.6);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -12px rgba(15,23,42,.12);
  --shadow-lg:0 24px 60px -20px rgba(60,50,140,.3);
  --ring:rgba(99,102,241,.35);
}
html[data-theme="dark"]{
  --bg:#080a16; --bg-2:#0c0f20; --surface:#11142a; --surface-2:#161a34;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
  --text:#eef1fb; --text-2:#a6adca; --text-3:#6b7397;
  --glass:rgba(20,24,48,.6); --glass-brd:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -16px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(70,50,180,.5);
  --ring:rgba(139,92,246,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  overflow:hidden; transition:background .4s ease,color .3s ease;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85;
  background:
    radial-gradient(60vw 40vw at 8% -8%,rgba(99,102,241,.18),transparent 60%),
    radial-gradient(50vw 40vw at 100% 0%,rgba(6,182,212,.14),transparent 55%),
    radial-gradient(45vw 40vw at 60% 120%,rgba(236,72,153,.12),transparent 60%);
}
.app{position:relative;z-index:1;display:grid;grid-template-columns:264px 1fr;height:100vh}

/* ===== SIDEBAR ===== */
.sidebar{background:var(--glass);backdrop-filter:blur(22px);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 16px;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;cursor:pointer}
.logo{width:38px;height:38px;border-radius:11px;background:var(--grad);position:relative;
  box-shadow:0 8px 22px -6px rgba(99,102,241,.6);flex:none;display:grid;place-items:center}
.logo::after{content:"";position:absolute;inset:6px;border-radius:7px;border:2px solid rgba(255,255,255,.85);border-top-color:transparent;border-right-color:transparent}
.logo span{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.brand-txt b{font-family:'Space Grotesk';font-size:19px;letter-spacing:.5px;display:block;line-height:1}
.brand-txt small{color:var(--text-3);font-size:11px;letter-spacing:.3px}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);padding:14px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;color:var(--text-2);
  font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:.18s;position:relative}
.nav svg{width:18px;height:18px;flex:none;stroke-width:1.9}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.active{background:linear-gradient(120deg,rgba(99,102,241,.16),rgba(139,92,246,.1));color:var(--text);border-color:var(--border-strong)}
.nav.active::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0;background:var(--grad)}
.nav .badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--grad-2);color:#fff}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.plan-card .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:7px}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .5s}

/* ===== MAIN ===== */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border);
  background:var(--glass);backdrop-filter:blur(18px);position:relative;z-index:30}
.crumb{font-size:12.5px;color:var(--text-3)}
.crumb b{color:var(--text);font-weight:600}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:9px 14px 9px 36px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13px;outline:none;transition:.2s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--text-3)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);display:grid;place-items:center;cursor:pointer;transition:.2s;position:relative}
.tbtn:hover{color:var(--text);border-color:var(--border-strong)}
.tbtn svg{width:18px;height:18px}
.tbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rose);border:2px solid var(--surface)}
.lang-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px;font-size:12px;font-weight:600}
.lang-toggle button{border:none;background:none;color:var(--text-3);padding:5px 10px;border-radius:8px;cursor:pointer;transition:.2s}
.lang-toggle button.on{background:var(--grad);color:#fff}
.avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#f59e0b,#ec4899);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;cursor:pointer}

/* search results dropdown */
.search-pop{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:13px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;z-index:40}
.search-pop.on{display:block}
.sp-item{display:flex;align-items:center;gap:11px;padding:10px 13px;cursor:pointer;font-size:13px}
.sp-item:hover{background:var(--surface-2)}
.sp-empty{padding:16px;text-align:center;color:var(--text-3);font-size:12.5px}

/* dropdowns */
.dropdown{position:absolute;top:52px;right:0;width:320px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:15px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;z-index:40}
.dropdown.on{display:block;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dd-head{padding:13px 15px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.dd-item{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.dd-item:hover{background:var(--surface-2)}
.dd-item:last-child{border:none}
.dd-item .di-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.dd-item b{font-size:12.5px;display:block} .dd-item small{font-size:11px;color:var(--text-3)}
.dd-foot{padding:11px 15px;text-align:center;font-size:12px;color:var(--brand);cursor:pointer;font-weight:600}
.dd-foot:hover{background:var(--surface-2)}

.content{flex:1;overflow-y:auto;padding:26px 30px 60px;position:relative}
.view{display:none;animation:fade .45s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.page-head h1{font-family:'Space Grotesk';font-size:26px;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.page-head .sub{color:var(--text-2);font-size:13.5px;margin-top:5px;max-width:640px}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:linear-gradient(120deg,rgba(16,185,129,.16),rgba(6,182,212,.12));color:var(--emerald);border:1px solid rgba(16,185,129,.25)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;font-size:13px;
  font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:.18s}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 10px 24px -10px rgba(99,102,241,.7)}
.btn.primary:hover{box-shadow:0 14px 30px -10px rgba(99,102,241,.85)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card.glow::before{content:"";position:absolute;inset:0;padding:1px;border-radius:16px;background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.kpi-grid{grid-template-columns:repeat(4,1fr)}
.kpi .lbl{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px;font-weight:500}
.kpi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}
.kpi .ico svg{width:16px;height:16px}
.kpi .val{font-family:'Space Grotesk';font-size:28px;margin:9px 0 4px;letter-spacing:.5px}
.kpi .delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--emerald)} .down{color:var(--rose)}
.spark{position:absolute;right:14px;bottom:12px;width:88px;height:34px;opacity:.85}

.section-title{font-family:'Space Grotesk';font-size:15px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.section-sub{font-size:12px;color:var(--text-3);margin-bottom:14px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);font-weight:600;padding:0 12px 11px}
td{padding:12px;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:11px}
.pfp{width:36px;height:36px;border-radius:11px;object-fit:cover;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.who b{font-size:13px;display:block} .who small{color:var(--text-3);font-size:11.5px}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.tag.v{background:rgba(16,185,129,.14);color:var(--emerald)}
.tag.w{background:rgba(245,158,11,.15);color:var(--amber)}
.tag.n{background:rgba(139,92,246,.14);color:var(--brand-2)}
.tag.c{background:rgba(6,182,212,.14);color:var(--cyan)}
.tag.r{background:rgba(244,63,94,.14);color:var(--rose)}
.tag.g{background:var(--surface-2);color:var(--text-2)}

.score{display:flex;align-items:center;gap:9px}
.ring{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}
.ring::before{content:attr(data-v);width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700}

.plines{display:flex;flex-direction:column;gap:12px}
.pline .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.pline .track{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.pline .track i{display:block;height:100%;border-radius:8px;transition:width .8s cubic-bezier(.2,.7,.3,1)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--border-strong)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}

.funnel{display:flex;flex-direction:column;gap:8px}
.fstep{display:flex;align-items:center;gap:12px}
.fstep .bar{height:40px;border-radius:10px;background:var(--grad);display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:14px;min-width:70px;transition:width .8s}
.fstep .meta{font-size:12.5px;color:var(--text-2)}
.fstep .meta b{color:var(--text);font-size:13.5px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.flow{display:flex;align-items:stretch;flex-wrap:wrap}
.flow .node{flex:1;min-width:150px;text-align:center;padding:16px 12px;position:relative}
.flow .node .ic{width:44px;height:44px;border-radius:13px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:var(--grad)}
.flow .node .ic svg{width:20px;height:20px}
.flow .node b{font-size:13px;display:block} .flow .node small{font-size:11px;color:var(--text-3);display:block;margin-top:4px;line-height:1.5}
.flow .node:not(:last-child)::after{content:"→";position:absolute;right:-6px;top:32px;color:var(--text-3);font-size:20px}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.mono{font-family:'JetBrains Mono';font-size:11.5px}
.divider{height:1px;background:var(--border);margin:18px 0}
.notice{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:13px;background:linear-gradient(120deg,rgba(245,158,11,.1),transparent);border:1px solid rgba(245,158,11,.25);font-size:12.5px;color:var(--text-2)}
.notice svg{width:18px;height:18px;color:var(--amber);flex:none}

/* studio */
.studio{display:grid;grid-template-columns:280px 1fr 300px;gap:16px;height:calc(100vh - 220px);min-height:520px}
.inbox{overflow-y:auto;padding:10px}
.mail-item{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:6px}
.mail-item:hover{background:var(--surface-2)}
.mail-item.on{background:linear-gradient(120deg,rgba(99,102,241,.12),transparent);border-color:var(--border-strong)}
.mail-item .r1{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.mail-item .r1 b{font-size:13px;flex:1} .mail-item .r1 small{font-size:10.5px;color:var(--text-3)}
.mail-item .snip{font-size:12px;color:var(--text-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.compose{display:flex;flex-direction:column}
.compose .head{display:flex;align-items:center;gap:11px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.mail-body{flex:1;overflow-y:auto;font-size:13.5px;line-height:1.75;color:var(--text-2)}
.from-ai{background:linear-gradient(120deg,rgba(99,102,241,.08),rgba(6,182,212,.05));border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;margin-top:8px}
.from-ai[contenteditable="true"]{outline:2px solid var(--brand);outline-offset:2px}
.ai-tag{position:absolute;top:-9px;left:14px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--grad);color:#fff}
.token{background:rgba(139,92,246,.16);color:var(--brand-2);padding:1px 6px;border-radius:6px;font-weight:600;font-family:'JetBrains Mono';font-size:12px}
.compose-actions{display:flex;gap:9px;padding-top:14px;border-top:1px solid var(--border);margin-top:14px;flex-wrap:wrap}
.insight-row{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--border)}
.insight-row:last-child{border:none}
.intent{display:flex;flex-direction:column;gap:9px}
.intent .it{display:flex;align-items:center;gap:9px;font-size:12.5px}
.intent .it .d{width:9px;height:9px;border-radius:50%}
.cursor::after{content:"▋";color:var(--brand);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* payment */
.pay-methods{display:flex;gap:10px;flex-wrap:wrap}
.pm{flex:1;min-width:150px;border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--surface-2);cursor:pointer;transition:.2s}
.pm:hover{border-color:var(--brand);transform:translateY(-2px)}
.pm.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.pm .n{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pm .s{font-size:11.5px;color:var(--text-3)}
.pm .amt{font-family:'Space Grotesk';font-size:18px;margin-top:9px}

/* vault */
.vault-grid{grid-template-columns:repeat(4,1fr)}
.reel{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:.22s}
.reel:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.reel .thumb{aspect-ratio:9/13;position:relative;display:grid;place-items:center;color:#fff}
.reel .thumb .play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.7)}
.reel .thumb .dur{position:absolute;bottom:9px;right:9px;font-size:10.5px;font-weight:600;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:20px;backdrop-filter:blur(4px)}
.reel .thumb .rights{position:absolute;top:9px;left:9px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;color:#fff}
.reel .info{padding:12px}
.reel .info b{font-size:12.5px;display:block}
.reel .info .st{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--text-3)}
.pub-targets{display:flex;gap:8px;margin-top:10px}
.pub-t{flex:1;font-size:11px;font-weight:600;text-align:center;padding:7px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;transition:.15s}
.pub-t:hover{border-color:var(--brand);color:var(--brand)}
.pub-t.done{color:var(--emerald);border-color:rgba(16,185,129,.3);cursor:default}

/* agency */
.tiers{grid-template-columns:repeat(3,1fr)}
.tier{border:1px solid var(--border);border-radius:18px;padding:22px;background:var(--surface);position:relative;box-shadow:var(--shadow)}
.tier.feat::before{content:"";position:absolute;inset:0;padding:1.5px;border-radius:18px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tier .nm{font-family:'Space Grotesk';font-size:17px}
.tier .pr{font-family:'Space Grotesk';font-size:34px;margin:10px 0 3px}
.tier .pr small{font-size:13px;color:var(--text-3);font-weight:400}
.tier ul{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:11px}
.tier li{font-size:12.5px;color:var(--text-2);display:flex;gap:9px;align-items:flex-start}
.tier li svg{width:16px;height:16px;color:var(--emerald);flex:none;margin-top:1px}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(6,8,20,.55);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex;animation:fade .2s ease}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;animation:rise .25s cubic-bezier(.2,.7,.3,1)}
.modal.wide{max-width:720px}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-head .mh-ic{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.modal-head .mh-ic svg{width:19px;height:19px}
.modal-head h3{font-family:'Space Grotesk';font-size:17px}
.modal-head p{font-size:12px;color:var(--text-3);margin-top:2px}
.modal-head .x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;color:var(--text-2)}
.modal-head .x:hover{color:var(--text)}
.modal-body{padding:22px;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:13.5px;outline:none;transition:.2s;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.field .hint{font-size:11px;color:var(--text-3);margin-top:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .opt{flex:1;min-width:110px;border:1px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;transition:.15s;font-size:12.5px}
.seg .opt:hover{border-color:var(--border-strong)}
.seg .opt.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring);background:linear-gradient(120deg,rgba(99,102,241,.08),transparent)}
.seg .opt b{display:block;font-size:13px;margin-bottom:3px}
.step-dots{display:flex;gap:6px;margin-bottom:18px}
.step-dots i{height:5px;flex:1;border-radius:5px;background:var(--surface-2)}
.step-dots i.on{background:var(--grad)}

/* toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border-strong);border-radius:13px;box-shadow:var(--shadow-lg);
  padding:13px 16px;display:flex;align-items:center;gap:11px;min-width:280px;max-width:380px;animation:slideIn .3s cubic-bezier(.2,.7,.3,1)}
.toast.out{animation:slideOut .3s ease forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.toast .ti svg{width:16px;height:16px}
.toast b{font-size:13px;display:block} .toast small{font-size:11.5px;color:var(--text-3)}

/* spinner */
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:var(--border-strong);border-top-color:var(--brand)}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-thinking{display:flex;align-items:center;gap:10px;padding:16px;color:var(--text-2);font-size:13px}

.confetti{position:fixed;width:9px;height:9px;z-index:300;pointer-events:none;border-radius:2px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.studio{grid-template-columns:1fr;height:auto}.vault-grid{grid-template-columns:repeat(2,1fr)}.tiers,.three-col{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}

/* -------------------- CONFETTI -------------------- */
function confetti(){
  const cols=['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ec4899'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.background=cols[i%cols.length];c.style.left=(45+Math.random()*10)+'%';c.style.top='40%';
    document.body.appendChild(c);
    const ang=Math.random()*Math.PI*2,vel=6+Math.random()*8;
    let x=0,y=0,vx=Math.cos(ang)*vel,vy=Math.sin(ang)*vel-6,op=1;
    const iv=setInterval(()=>{vy+=0.5;x+=vx;y+=vy;op-=0.02;
      c.style.transform=`translate(${x}px,${y}px) rotate(${x*4}deg)`;c.style.opacity=op;
      if(op<=0){clearInterval(iv);c.remove();}},16);
  }
}

function typewriter(elId,text,cb){
  const el=$(elId);if(!el)return;el.classList.add('cursor');el.innerHTML='';
  let i=0;const speed=12;
  (function step(){
    if(i>=text.length){el.classList.remove('cursor');el.innerHTML=tokenize(text);if(cb)cb();return;}
    // reveal char-by-char but render tokens live
    i+=Math.max(1,Math.round(Math.random()*2));
    el.innerHTML=tokenize(text.slice(0,i));
    setTimeout(step,speed);
  })();
}
function generateEmail(initial){
  const c=cget(composeState.cid),isCold=composeState.mode==='cold';
  const pool=emailVariants[isCold?'cold':'reply'];
  if(!initial)composeState.variant=(composeState.variant+1)%pool.length;
  composeState.editing=false;
  renderCompose();
  const v=pool[composeState.variant];const text=lang==='en'?v.en(c):v.zh(c);
  const dt=$('draft-text');if(dt){typewriter('draft-text',text);}
  spendCredits(60);
  if(!initial)toast('New variant generated','已生成新版本','info');
}
function toggleEdit(){
  composeState.editing=!composeState.editing;renderCompose();

}

  <div class="card glow" style="margin-bottom:16px;display:flex;align-items:center;gap:22px;flex-wrap:wrap">
    <div style="flex:1;min-width:260px">
      <span class="pill">${t('Fastest conversion wedge','最快转化钩子')}</span>
      <div style="font-family:'Space Grotesk';font-size:22px;margin:10px 0 4px">${t('Starter Sample Pack','入门样品包')}</div>
      <div style="font-size:13px;color:var(--text-2);max-width:460px">${t('100 hand-matched, verified leads for your exact product — low-risk taster that converts sellers into subscribers.','100 条为你的商品精准匹配、已验证的线索 —— 低风险尝鲜，把卖家转化成订阅用户。')}</div>
    </div>
    <div style="text-align:center">
      <div style="font-family:'Space Grotesk';font-size:40px;line-height:1">$99</div>
      <div style="font-size:12px;color:var(--text-3);margin-bottom:12px">${t('one-time · 100 leads','一次性 · 100 条')}</div>
      <button class="btn primary" onclick="buySamplePack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>${t('Buy sample pack','购买样品包')}</button>
    </div>
  </div>

  <!-- PERFORMANCE / REV SHARE -->
  <div class="card" style="margin-bottom:16px">
    <div class="section-title">${t('Performance / Revenue-Share','按结果 / 分成')}</div>
    <div class="section-sub">${t('For sellers who want done-for-you. Charge on outcomes, never "guaranteed conversion".','面向想要全托管的卖家。按结果收费，绝不承诺“保证转化”。')}</div>
    <div class="three-col">
      ${Object.entries(REV_MODELS).map(([k,v])=>`<div class="tier ${DB.billing.revModel===k?'feat':''}" style="cursor:pointer;padding:18px" onclick="chooseRevModel('${k}')">
        ${DB.billing.revModel===k?`<span class="pill" style="position:absolute;top:14px;right:14px">${t('Selected','已选')}</span>`:''}
        <div class="nm" style="font-size:15px">${t(v.en,v.zh)}</div>
        <div style="font-size:12px;color:var(--text-3);margin-top:8px">${t(v.d_en,v.d_zh)}</div>
        <button class="btn ${DB.billing.revModel===k?'primary':''} sm" style="margin-top:14px;width:100%;justify-content:center">${DB.billing.revModel===k?t('Active','使用中'):t('Choose','选择')}</button>
      </div>`).join('')}
    </div>
  </div>

  <!-- PAYMENT TAKE-RATE + PLANS -->
  <div class="two-col" style="margin-bottom:16px">
    <div class="card">
      <div class="section-title">${t('Payment & Escrow Take-Rate','支付与托管费率')}</div>
      <div class="section-sub">${t('You earn on every payout the platform processes.','平台处理的每一笔放款你都有收益。')}</div>
      <div style="margin-top:6px">
        ${feeRow(t('PayPal payout','PayPal 放款'),'2.0%',t('+ FX at cost','+ 汇率按成本'))}
        ${feeRow(t('USDC / USDT (on-chain)','USDC/USDT 链上'),'1.0%',t('gasless, instant','免Gas，秒到'))}
        ${feeRow(t('BTC / ETH auto-convert','BTC/ETH 自动兑换'),'1.5%',t('+ 0.6% FX spread','+ 0.6% 汇率价差'))}
        ${feeRow(t('Escrow float (held funds)','托管浮存（在管资金）'),t('yield','收益'),t('platform-side','平台侧'))}
      </div>
      <div class="divider"></div>
      <div class="notice" style="background:linear-gradient(120deg,rgba(16,185,129,.1),transparent);border-color:rgba(16,185,129,.25)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--emerald)"><path d="M12 2 4 6v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10V6z"/></svg>${t('Fees shown to sellers upfront. This line scales purely with volume — no extra delivery.','费用对卖家透明前置。这条收入随交易量增长，无额外交付成本。')}</div>
    </div>
    <div class="card">
      <div class="section-title">${t('Subscription (SaaS seats)','订阅（SaaS 席位）')}</div>
      <div class="section-sub">${t('Recurring MRR on top of usage. Manage seats & the tool layer.','在用量之上叠加稳定 MRR，管理席位与工具层。')}</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
        ${planRow('Starter','$99',t('/mo · 3 seats · 20k credits','/月 · 3席 · 2万额度'),false)}
        ${planRow('Scale','$299',t('/mo · 10 seats · 50k credits','/月 · 10席 · 5万额度'),true)}
        ${planRow('Enterprise',t('Custom','定制'),t('SSO · API · SLA','SSO · API · SLA'),false)}
      </div>
    </div>
  </div>

  <!-- INVOICES -->
  <div class="card">
    <div class="section-title">${t('Recent Invoices','最近账单')}</div>
    <div id="invoice-table" style="margin-top:8px"></div>
  </div>`;
  renderInvoices();updateLeadCalc();
  requestAnimationFrame(()=>document.querySelectorAll('#billing .track i').forEach(i=>i.style.width=i.dataset.w));
}
function feeRow(a,b,c){return `<div class="insight-row"><span>${a}</span><span style="display:flex;gap:10px;align-items:center"><span style="font-size:11px;color:var(--text-3)">${c}</span><b class="mono" style="color:var(--emerald)">${b}</b></span></div>`;}
function planRow(nm,pr,desc,cur){return `<div class="pm" style="display:flex;align-items:center;gap:14px;cursor:${cur?'default':'pointer'}" ${cur?'':`onclick="choosePlanBilling('${nm}')"`}>
  <div style="flex:1"><div class="n" style="margin:0">${nm} ${cur?`<span class="tag v" style="font-size:10px">${t('current','当前')}</span>`:''}</div><div class="s">${desc}</div></div>
  <div class="amt" style="margin:0;font-size:18px">${pr}</div>
  ${cur?'':`<button class="btn sm">${t('Switch','切换')}</button>`}</div>`;}
function renderInvoices(){
  $('invoice-table').innerHTML=`<table><thead><tr><th>${t('Date','日期')}</th><th>${t('Description','说明')}</th><th style="text-align:right">${t('Amount','金额')}</th><th style="text-align:right">${t('Invoice','发票')}</th></tr></thead><tbody>${DB.billing.invoices.map(v=>`<tr><td class="mono" style="color:var(--text-3)">${v.date}</td><td><b>${t(v.en,v.zh)}</b></td><td style="text-align:right"><b>${money(v.amt)}</b></td><td style="text-align:right"><span class="btn ghost sm" onclick="toast('Invoice downloaded (PDF)','账单已下载 (PDF)')" style="cursor:pointer">PDF ↓</span></td></tr>`).join('')}</tbody></table>`;
}
function toggleRefill(){DB.billing.autoRefill=!DB.billing.autoRefill;renderBilling();toast(DB.billing.autoRefill?t('Auto-refill on','已开启自动续充'):t('Auto-refill off','已关闭自动续充'),'','info');}
function setLeadTier(k,el){DB.billing.leadTier=k;el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');updateLeadCalc();}
function setLeadQty(n){DB.billing.leadQty=n;const inp=$('lead-qty');if(inp)inp.value=n;updateLeadCalc();}
function leadCalc(){
  const q=Math.max(0,parseInt(($('lead-qty')||{}).value)||0);
  const p=LEAD_TIERS[DB.billing.leadTier].p;
  const disc=q>=10000?0.15:q>=5000?0.10:0;
  return{q,p,disc,net:q*p*(1-disc)};
}
function updateLeadCalc(){
  const{q,disc,net}=leadCalc();DB.billing.leadQty=q;
  const tot=$('lead-total');if(tot)tot.textContent=money(Math.round(net));
  const de=$('lead-disc');if(de)de.textContent=disc?('−'+(disc*100)+'% '+t('volume discount','批量折扣')):t('no volume discount yet','未达批量折扣门槛');
  const tn=$('lead-tiername');if(tn)tn.textContent=t(LEAD_TIERS[DB.billing.leadTier].en,LEAD_TIERS[DB.billing.leadTier].zh);
}
function buyLeads(){
  const{q,net}=leadCalc();if(q<=0){toast('Enter a quantity first','请先输入数量','warn');return;}
  const tierName=t(LEAD_TIERS[DB.billing.leadTier].en,LEAD_TIERS[DB.billing.leadTier].zh);
  openModal({title:t('Confirm lead purchase','确认购买线索'),desc:tierName,icon:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/>',
    body:`<div class="field-row"><div class="field"><label>${t('Leads','线索数')}</label><input value="${q.toLocaleString()}" readonly></div><div class="field"><label>${t('Total','合计')}</label><input value="${money(Math.round(net))}" readonly></div></div>
      <div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 9v4M12 17h.01"/></svg>${t('You are only billed for leads that pass email-deliverability verification. Undeliverable ones are refunded automatically.','仅对通过邮箱可送达验证的线索计费，无法送达的自动退款。')}</div>`,
    foot:`<button class="btn ghost" onclick="closeModal()">${t('Cancel','取消')}</button><button class="btn primary" onclick="doBuyLeads(${Math.round(net)},${q})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>${t('Confirm & charge','确认扣款')}</button>`});
}
function doBuyLeads(amt,q){
  DB.billing.spend+=amt;DB.billing.invoices.unshift({date:t('Today','今日'),en:q.toLocaleString()+' verified leads',zh:q.toLocaleString()+' 条已验证线索',amt});
  closeModal();confetti();toast(q.toLocaleString()+t(' leads purchased — added to your library',' 条线索已购买 — 已加入线索库'));
  renderBilling();
}
function buySamplePack(){
  openModal({title:t('Starter Sample Pack','入门样品包'),desc:t('100 verified, product-matched leads','100 条已验证、商品匹配线索'),icon:'<path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5"/>',
    body:`<div class="field"><label>${t('Your product / ASIN','你的商品 / ASIN')}</label><input value="Amber Dusk Soy Candle · B0ABC123" class="mono"></div>
      <div class="field"><label>${t('Match to','匹配方向')}</label><select><option>${t('Similar-product creators (recommended)','同类商品达人（推荐）')}</option><option>${t('Category creators','品类达人')}</option><option>${t('Competitor-audience creators','竞品受众达人')}</option></select></div>
      <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)"><span>${t('One-time total','一次性合计')}</span><b style="font-family:'Space Grotesk';font-size:20px">$99</b></div>`,
    foot:`<button class="btn ghost" onclick="closeModal()">${t('Cancel','取消')}</button><button class="btn primary" onclick="doSample()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>${t('Buy for $99','支付 $99')}</button>`});
}
function doSample(){
  DB.billing.spend+=99;DB.billing.invoices.unshift({date:t('Today','今日'),en:'Sample pack · 100 matched leads',zh:'样品包 · 100 条匹配线索',amt:99});
  closeModal();confetti();toast(t('Sample pack purchased — 100 leads matching your product','样品包已购买 — 100 条匹配你商品的线索'));
  renderBilling();
}
function topUp(i){
  const p=CREDIT_PACKS[i],credits=Math.round(p.c*(1+p.bonus/100));
  openModal({title:t('Add credits','充值额度'),desc:(p.c/1000)+'k'+(p.bonus?' +'+p.bonus+'% '+t('bonus','赠送'):''),icon:'<path d="M13 2 3 14h7l-1 8 10-12h-7z"/>',
    body:`<div class="field-row"><div class="field"><label>${t('Credits added','到账额度')}</label><input value="${credits.toLocaleString()}" readonly></div><div class="field"><label>${t('Charge','扣款')}</label><input value="${money(p.price)}" readonly></div></div>
      <div class="field"><label>${t('Pay with','支付方式')}</label><select><option>${t('Wallet balance','钱包余额')} (${money(DB.billing.cash)})</option><option>Visa •••• 4242</option><option>PayPal</option><option>USDC</option></select></div>`,
    foot:`<button class="btn ghost" onclick="closeModal()">${t('Cancel','取消')}</button><button class="btn primary" onclick="doTopUp(${credits},${p.price})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>${t('Confirm','确认')}</button>`});
}
function doTopUp(credits,price){
  DB.credits.total+=credits;DB.billing.spend+=price;
  DB.billing.invoices.unshift({date:t('Today','今日'),en:'Credit top-up · '+(credits/1000).toFixed(0)+'k',zh:'额度充值 · '+(credits/1000).toFixed(0)+'k',amt:price});
  spendCredits(0);
  closeModal();confetti();toast(credits.toLocaleString()+t(' credits added',' 额度已到账'));
  renderBilling();
}
function chooseRevModel(k){DB.billing.revModel=k;renderBilling();toast(t('Revenue model set: ','已设置分成模式：')+t(REV_MODELS[k].en,REV_MODELS[k].zh),'','info');}
function choosePlanBilling(nm){toast(nm+t(' plan selected',' 套餐已选择'),'','info');}

/* -------------------- MASTER RENDER -------------------- */
function renderView(id){({dashboard:renderDashboard,discover:renderDiscover,profile:renderProfile,outreach:renderOutreach,payments:renderPayments,vault:renderVault,agency:renderAgency,billing:renderBilling}[id]||(()=>{}))();}
function renderAll(){
  const active=document.querySelector('.view.active');
  renderView(active?active.id:'dashboard');
}

/* -------------------- BOOT -------------------- */
DB.selected='lena';
renderDashboard();
</script>
</body>
</html>
